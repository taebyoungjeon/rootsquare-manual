<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>루트스퀘어 운영 매뉴얼</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">ROOTSQUARE OPS WIKI</p>
      <h1>루트스퀘어 운영 매뉴얼</h1>
    </div>
    <div class="status-pill">초안 v0.1</div>
  </header>

  <main class="app-shell">
    <aside class="sidebar" aria-label="매뉴얼 카테고리">
      <button class="category is-active" data-category="all">
        <span>전체</span>
        <strong id="count-all">0</strong>
      </button>
      <button class="category" data-category="drink">
        <span>음료 제조</span>
        <strong id="count-drink">0</strong>
      </button>
      <button class="category" data-category="drinkRecipe">
        <span>음료 레시피</span>
        <strong id="count-drinkRecipe">0</strong>
      </button>
      <button class="category" data-category="baseRecipe">
        <span>베이스 제조</span>
        <strong id="count-baseRecipe">0</strong>
      </button>
      <button class="category" data-category="dessertRecipe">
        <span>디저트·베이커리</span>
        <strong id="count-dessertRecipe">0</strong>
      </button>
      <button class="category" data-category="shift">
        <span>오픈·클로즈</span>
        <strong id="count-shift">0</strong>
      </button>
      <button class="category" data-category="service">
        <span>고객 응대</span>
        <strong id="count-service">0</strong>
      </button>
      <button class="category" data-category="parttimer">
        <span>파트타이머</span>
        <strong id="count-parttimer">0</strong>
      </button>
      <button class="category" data-category="clean">
        <span>위생·청소</span>
        <strong id="count-clean">0</strong>
      </button>
      <button class="category" data-category="stock">
        <span>재고·발주</span>
        <strong id="count-stock">0</strong>
      </button>
      <button class="category" data-category="equipment">
        <span>장비 유지보수</span>
        <strong id="count-equipment">0</strong>
      </button>
    </aside>

    <section class="workspace">
      <section class="notice-panel" aria-label="중요 공지">
        <div>
          <p class="notice-label">TODAY</p>
          <h2>오늘의 필수 확인</h2>
        </div>
        <div class="notice-content">
          <div class="must-checks" id="today-checks"></div>
          <div class="notice-groups" id="notice-groups"></div>
        </div>
      </section>

      <div class="search-panel">
        <label for="manual-search">검색</label>
        <input id="manual-search" type="search" placeholder="예: 오픈, 품절, 티라미수, ㅌㄹㅁㅅ, ㅂㄴㄹㄹㄸ">
      </div>

      <section class="quick-links" aria-label="상황별 바로가기">
        <button data-shortcut="open">출근 직후</button>
        <button data-shortcut="parttimer">파트타이머</button>
        <button data-shortcut="drinkRecipe">음료 레시피</button>
        <button data-shortcut="baseRecipe">베이스 제조</button>
        <button data-shortcut="dessertRecipe">디저트</button>
        <button data-shortcut="rush">피크타임</button>
        <button data-shortcut="claim">품절 안내</button>
        <button data-shortcut="close">마감 전</button>
      </section>

      <div class="content-grid">
        <section class="article-list" aria-label="매뉴얼 목록">
          <div class="section-heading">
            <h2>항목</h2>
            <span id="result-count">0개</span>
          </div>
          <div id="articles"></div>
        </section>

        <article class="article-detail" id="article-detail" aria-live="polite">
          <div class="empty-state">
            <h2>찾고 싶은 항목을 선택하세요</h2>
            <p>왼쪽 카테고리나 검색창으로 필요한 매뉴얼을 바로 찾을 수 있습니다.</p>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script src="manual-data.js"></script>
  <script src="recipe-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
