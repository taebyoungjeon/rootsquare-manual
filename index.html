<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>루트스퀘어 운영 매뉴얼</title>
  <link rel="stylesheet" href="styles.css?v=20260711-article-list-collapse">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">ROOTSQUARE OPS WIKI</p>
      <h1>루트스퀘어 운영 매뉴얼</h1>
    </div>
    <div class="status-pill">초안 v0.1</div>
  </header>

  <main class="app-shell">
    <aside class="sidebar" aria-label="매뉴얼 카테고리">
      <button class="category is-active" data-category="all">
        <span>전체</span>
        <strong id="count-all">0</strong>
      </button>
      <button class="category" data-category="drink">
        <span>음료 제조</span>
        <strong id="count-drink">0</strong>
      </button>
      <button class="category" data-category="drinkRecipe">
        <span>음료 레시피</span>
        <strong id="count-drinkRecipe">0</strong>
      </button>
      <button class="category" data-category="baseRecipe">
        <span>베이스 제조</span>
        <strong id="count-baseRecipe">0</strong>
      </button>
      <button class="category" data-category="dessertRecipe">
        <span>디저트·베이커리</span>
        <strong id="count-dessertRecipe">0</strong>
      </button>
      <button class="category" data-category="shift">
        <span>오픈·클로즈</span>
        <strong id="count-shift">0</strong>
      </button>
      <button class="category" data-category="service">
        <span>고객 응대</span>
        <strong id="count-service">0</strong>
      </button>
      <button class="category" data-category="parttimer">
        <span>파트타이머</span>
        <strong id="count-parttimer">0</strong>
      </button>
      <button class="category" data-category="clean">
        <span>위생·청소</span>
        <strong id="count-clean">0</strong>
      </button>
      <button class="category" data-category="stock">
        <span>재고·발주</span>
        <strong id="count-stock">0</strong>
      </button>
      <button class="category" data-category="equipment">
        <span>장비 유지보수</span>
        <strong id="count-equipment">0</strong>
      </button>
      <button class="category" data-category="stayHistory">
        <span>스테이 운영 히스토리</span>
        <strong id="count-stayHistory">0</strong>
      </button>
    </aside>

    <section class="workspace">
      <section class="notice-panel" aria-label="중요 공지">
        <div>
          <p class="notice-label">TODAY</p>
          <h2>오늘의 필수 확인</h2>
        </div>
        <div class="notice-content">
          <div class="must-checks" id="today-checks"></div>
          <div class="notice-groups" id="notice-groups"></div>
          <button class="notice-expand-toggle" id="notice-expand-toggle" type="button" aria-expanded="false">나머지 보기</button>
        </div>
        <a class="notice-manage-link" id="notice-manage-link" href="https://docs.google.com/spreadsheets/d/1PDUafhnQVo9Mour8NO37KApuAreHvZLYaLrZlh8gnuw/edit#gid=0" target="_blank" rel="noopener">오늘의 필수확인 관리</a>
      </section>

      <section class="daily-check-panel" aria-label="데일리 체크리스트 제출">
        <div class="daily-check-head">
          <div>
            <p class="notice-label">DAILY CHECK</p>
            <h2>오픈·마감 체크 제출</h2>
          </div>
          <div class="daily-check-tabs" role="tablist" aria-label="체크리스트 유형">
            <button type="button" class="is-active" data-daily-check-type="open">오픈 체크</button>
            <button type="button" data-daily-check-type="close">마감 체크</button>
          </div>
        </div>
        <a class="daily-manage-link" id="daily-manage-link" href="https://docs.google.com/spreadsheets/d/1PDUafhnQVo9Mour8NO37KApuAreHvZLYaLrZlh8gnuw/edit?gid=1897809790#gid=1897809790" target="_blank" rel="noopener">체크리스트 항목 관리</a>
        <form id="daily-check-form" class="daily-check-form">
          <label class="daily-name-field">
            <span>담당자 이름</span>
            <input id="daily-check-name" name="staffName" type="text" placeholder="예: 김루트" autocomplete="name" required>
          </label>
          <div class="daily-check-items" id="daily-check-items"></div>
          <label class="daily-note-field">
            <span>특이사항 메모</span>
            <textarea id="daily-check-note" name="note" rows="3" placeholder="미체크 사유나 인수인계할 내용을 적어주세요."></textarea>
          </label>
          <div class="daily-check-actions">
            <p id="daily-check-status" aria-live="polite">제출 기록은 Google Sheet와 관리자 이메일로 남길 예정입니다.</p>
            <button type="submit">제출하기</button>
          </div>
        </form>
      </section>

      <section class="inventory-check-panel" aria-label="마감 재고 체크">
        <div class="daily-check-head">
          <div>
            <p class="notice-label">CLOSING STOCK</p>
            <h2>재고·베이스 체크</h2>
          </div>
          <button class="inventory-collapse-toggle" id="inventory-collapse-toggle" type="button" aria-expanded="false" aria-controls="inventory-check-form">재고 체크 열기</button>
        </div>
        <a class="daily-manage-link" id="inventory-manage-link" href="https://docs.google.com/spreadsheets/d/1PDUafhnQVo9Mour8NO37KApuAreHvZLYaLrZlh8gnuw/edit#gid=0" target="_blank" rel="noopener">재고 기준 관리</a>
        <form id="inventory-check-form" class="inventory-check-form" hidden>
          <label class="daily-name-field">
            <span>담당자 이름</span>
            <input id="inventory-check-name" name="staffName" type="text" placeholder="예: 김루트" autocomplete="name" required>
          </label>
          <div class="inventory-items" id="inventory-check-items"></div>
          <label class="daily-note-field">
            <span>재고 특이사항</span>
            <textarea id="inventory-check-note" name="note" rows="3" placeholder="상태가 좋지 않은 재료, 내일 제조가 필요한 베이스 등을 적어주세요."></textarea>
          </label>
          <div class="daily-check-actions">
            <p id="inventory-check-status" aria-live="polite">기준 이하 품목은 제출 시 관리자 이메일에 표시됩니다.</p>
            <button type="submit">재고 제출</button>
          </div>
        </form>
      </section>

      <div class="search-panel">
        <label for="manual-search">검색</label>
        <input id="manual-search" type="search" placeholder="예: 오픈, 품절, 티라미수, ㅌㅁㅌ, ㅂㄴㄹㄹㄸ">
      </div>

      <section class="quick-links" aria-label="상황별 바로가기">
        <button data-shortcut="open">출근 직후</button>
        <button data-shortcut="schedule">오늘 근무</button>
        <button data-shortcut="parttimer">파트타이머</button>
        <button data-shortcut="drinkRecipe">음료 레시피</button>
        <button data-shortcut="baseRecipe">베이스 제조</button>
        <button data-shortcut="dessertRecipe">디저트</button>
        <button data-shortcut="rush">피크타임</button>
        <button data-shortcut="claim">품절 안내</button>
        <button data-shortcut="close">마감 전</button>
      </section>

      <div class="content-grid" id="manual-content">
        <section class="article-list" aria-label="매뉴얼 목록">
          <div class="section-heading">
            <h2>항목</h2>
            <span id="result-count">0개</span>
          </div>
          <div id="articles"></div>
        </section>

        <article class="article-detail" id="article-detail" aria-live="polite">
          <div class="empty-state">
            <h2>찾고 싶은 항목을 선택하세요</h2>
            <p>왼쪽 카테고리나 검색창으로 필요한 매뉴얼을 바로 찾을 수 있습니다.</p>
          </div>
        </article>
      </div>
    </section>
  </main>

  <div class="fab-group">
    <button class="fab fab-schedule" id="fab-schedule" type="button" aria-label="오늘 근무표" title="오늘 근무표">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="5" width="16" height="15" rx="2"></rect>
        <path d="M8 3v4M16 3v4M4 10h16"></path>
        <path d="M8 14h3M13 14h3M8 17h3"></path>
      </svg>
      <span class="fab-badge" id="schedule-change-badge" hidden>N</span>
    </button>
    <button class="fab" id="fab-top" type="button" aria-label="맨 위로" title="맨 위로">↑</button>
    <button class="fab" id="fab-items" type="button" aria-label="항목으로 이동" title="항목으로 이동">↓</button>
  </div>

  <script src="manual-data.js?v=20260729-stay-complaint-history"></script>
  <script src="recipe-data.js?v=20260610-recipes"></script>
  <script src="schedule-data.js?v=2026080306-auto-tabs"></script>
  <script>
    window.CHECKLIST_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbwVgNBEpgcVsUT230nKVxXMLpXKrxpu5gNKyUnZw8DXwSdFreBXrr1tgUOb42yUjKTmJg/exec";
    window.CHECKLIST_MANAGE_URL = "https://docs.google.com/spreadsheets/d/1PDUafhnQVo9Mour8NO37KApuAreHvZLYaLrZlh8gnuw/edit?gid=1897809790#gid=1897809790";
    window.TODAY_NOTICE_MANAGE_URL = "https://docs.google.com/spreadsheets/d/1PDUafhnQVo9Mour8NO37KApuAreHvZLYaLrZlh8gnuw/edit#gid=0";
    window.INVENTORY_MANAGE_URL = "https://docs.google.com/spreadsheets/d/1PDUafhnQVo9Mour8NO37KApuAreHvZLYaLrZlh8gnuw/edit#gid=0";
  </script>
  <script src="app.js?v=20260715-inventory-threshold-overrides"></script>
</body>
</html>
